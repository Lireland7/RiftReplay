<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Record Game — RiftReplay</title>
<style>
  :root {
    --bg: #0d1017;
    --panel: #141925;
    --field: #1b2230;
    --field-border: #2a3346;
    --ink: #e8eaf0;
    --label: #7aa2d6;          /* light blue labels, like the reference */
    --dim: #8b93a7;
    --gold: #c9a227;
    --accent: #2dd4a7;
    --accent-2: #3b6fd4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    padding: 18px 20px 90px;
  }
  h1 {
    font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gold); font-weight: 600; margin-bottom: 14px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.span2 { grid-column: 1 / -1; }
  label { font-size: 12px; font-weight: 600; color: var(--label); }
  input, select {
    background: var(--field);
    border: 1px solid var(--field-border);
    border-radius: 6px;
    color: var(--ink);
    padding: 9px 11px;
    font: inherit;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--accent-2); }
  select { appearance: none; cursor: pointer; }

  /* legend image combobox */
  .legend-combo { position: relative; }
  .lc-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--field); border: 1px solid var(--field-border); border-radius: 6px;
    color: var(--ink); padding: 6px 10px; font: inherit; cursor: pointer; text-align: left;
  }
  .lc-btn:hover { border-color: var(--accent-2); }
  .lc-sel { display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; }
  .lc-placeholder { color: var(--dim); }
  .lc-caret { color: var(--dim); flex: 0 0 auto; }
  .lc-img {
    flex: 0 0 auto; width: 30px; height: 22px; border-radius: 3px;
    background-size: cover; background-position: center 16%; background-color: #10151f;
  }
  .lc-noimg { background: #10151f; }
  .lc-menu {
    position: absolute; z-index: 20; top: calc(100% + 3px); left: 0; right: 0;
    background: var(--panel); border: 1px solid var(--field-border); border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5); padding: 6px; max-height: 280px; display: flex; flex-direction: column;
  }
  .lc-search { margin-bottom: 6px; padding: 7px 9px; }
  .lc-list { overflow-y: auto; }
  .lc-opt {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 4px 6px;
    background: none; border: none; color: var(--ink); font: inherit; cursor: pointer; border-radius: 4px; text-align: left;
  }
  .lc-opt:hover { background: var(--field); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .extra-row { display: flex; gap: 10px; align-items: center; }
  .chk {
    display: flex; align-items: center; gap: 7px;
    background: var(--field); border: 1px solid var(--field-border);
    border-radius: 6px; padding: 8px 12px; cursor: pointer; user-select: none;
  }
  .chk input { width: 15px; height: 15px; accent-color: var(--gold); cursor: pointer; }
  .hint { color: var(--dim); font-size: 11px; margin-top: 4px; }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--panel);
    border-top: 1px solid var(--field-border);
    padding: 14px 20px;
    display: flex; gap: 12px; justify-content: flex-end;
  }
  button {
    font: inherit; font-weight: 600; border: none; border-radius: 7px;
    padding: 10px 18px; cursor: pointer; color: #0d1017;
  }
  button.secondary { background: #2a3346; color: var(--ink); }
  button.continue { background: var(--accent-2); color: #fff; }
  button.complete { background: var(--accent); }
  button:hover { filter: brightness(1.08); }
  .matchline { color: var(--dim); font-size: 11px; margin-bottom: 14px; }
  .matchline b { color: var(--ink); }
</style>
</head>
<body>
  <h1>Record Game</h1>
  <div class="matchline" id="matchline"></div>

  <div class="grid">
    <div class="field">
      <label for="result">Result</label>
      <select id="result">
        <option>Win</option><option>Loss</option><option>Draw</option>
      </select>
    </div>
    <div class="field">
      <label for="format">Format</label>
      <select id="format">
        <option>Bo3</option><option>Bo1</option><option>Bo5</option>
      </select>
    </div>

    <div class="field">
      <label for="seat">Seat</label>
      <select id="seat">
        <option>Unknown</option><option>First</option><option>Second</option>
      </select>
    </div>
    <div class="field">
      <label for="opponent">Opponent</label>
      <input id="opponent" type="text" placeholder="Opponent name">
    </div>

    <div class="field">
      <label>Score</label>
      <div class="two">
        <input id="myScore" type="number" min="0" placeholder="My score">
        <input id="oppScore" type="number" min="0" placeholder="Opponent score">
      </div>
    </div>
    <div class="field">
      <label for="wentFirst">Who went first</label>
      <select id="wentFirst">
        <option>Unknown</option><option>Me</option><option>Opponent</option>
      </select>
    </div>

    <div class="field">
      <label>My legend</label>
      <div class="legend-combo" id="combo-myLegend">
        <input id="myLegend" type="hidden">
        <button type="button" class="lc-btn"><span class="lc-sel lc-placeholder">Select legend…</span><span class="lc-caret">▾</span></button>
        <div class="lc-menu" hidden>
          <input type="text" class="lc-search" placeholder="Search legends…">
          <div class="lc-list"></div>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Opponent legend</label>
      <div class="legend-combo" id="combo-oppLegend">
        <input id="oppLegend" type="hidden">
        <button type="button" class="lc-btn"><span class="lc-sel lc-placeholder">Select legend…</span><span class="lc-caret">▾</span></button>
        <div class="lc-menu" hidden>
          <input type="text" class="lc-search" placeholder="Search legends…">
          <div class="lc-list"></div>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="myBattlefield">My battlefield</label>
      <input id="myBattlefield" type="text">
    </div>
    <div class="field">
      <label for="oppBattlefield">Opponent battlefield</label>
      <input id="oppBattlefield" type="text">
    </div>

    <div class="field">
      <label for="deck">Deck</label>
      <input id="deck" type="text">
    </div>
    <div class="field">
      <label for="deckName">Deck name</label>
      <input id="deckName" type="text">
    </div>

    <div class="field">
      <label for="turns">Turns (approx.)</label>
      <input id="turns" type="number" min="0" placeholder="Auto-detected">
    </div>
    <div class="field">
      <label>Mulligan</label>
      <div class="extra-row">
        <label class="chk"><input type="checkbox" id="tookMulligan"> Took mulligan</label>
      </div>
    </div>

    <div class="field span2">
      <label>Extra battlefield</label>
      <div class="extra-row">
        <label class="chk"><input type="checkbox" id="baronPit"> Baron Pit</label>
        <label class="chk"><input type="checkbox" id="brush"> Brush</label>
      </div>
      <div class="hint">Only saved when ticked. Kept separate from normal battlefield stats.</div>
    </div>

    <!-- Hidden passthrough fields (auto-detected, not user-editable) -->
    <input type="hidden" id="mulliganCards">
    <input type="hidden" id="keptCards">
    <input type="hidden" id="cardsDrawn">
    <input type="hidden" id="sideboardCardsDrawn">
    <input type="hidden" id="playedCards">
  </div>

  <footer>
    <button class="secondary" id="cancel">Cancel</button>
    <button class="continue" id="continueMatch">Continue Match</button>
    <button class="complete" id="completeMatch">Complete Match</button>
  </footer>

<script>
  const $ = id => document.getElementById(id);
  const fields = ['result','format','seat','opponent','myScore','oppScore',
    'wentFirst','myLegend','oppLegend','myBattlefield','oppBattlefield',
    'deck','deckName','turns','mulliganCards','keptCards','cardsDrawn','sideboardCardsDrawn','playedCards'];

  function setVal(id, v) {
    if (v === undefined || v === null || v === '') return;
    const el = $(id);
    if (el) el.value = v;
  }

  /* ─── legend image comboboxes ─── */
  const CARD_DB_URL = 'https://russeus.github.io/RB-TCG-Arena/Riftbound-CardList.json';
  let LEGENDS = [];
  const escH = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const comboIds = ['combo-myLegend', 'combo-oppLegend'];
  const comboEls = cid => {
    const root = $(cid);
    return { root, input: root.querySelector('input'), btn: root.querySelector('.lc-btn'),
             sel: root.querySelector('.lc-sel'), menu: root.querySelector('.lc-menu'),
             search: root.querySelector('.lc-search'), list: root.querySelector('.lc-list') };
  };
  const imgSpan = url => url ? `<span class="lc-img" style="background-image:url('${url.replace(/'/g,'')}')"></span>` : '<span class="lc-img lc-noimg"></span>';

  // Fold Unit champion forms / art variants onto the champion's Legend card, by
  // the champion name (text before the first comma). So "Viktor, Leader" (a Unit)
  // resolves to the "Viktor, ..." Legend option.
  const champKey = n => String(n || '').split(',')[0].trim().toLowerCase();
  function canonLegendName(name) {
    if (!name) return name;
    const l = LEGENDS.find(x => champKey(x.name) === champKey(name));
    return l ? l.name : name;
  }
  function setCombo(cid, name) {
    name = canonLegendName(name);
    const e = comboEls(cid);
    e.input.value = name || '';
    if (!name) { e.sel.className = 'lc-sel lc-placeholder'; e.sel.textContent = 'Select legend…'; return; }
    const l = LEGENDS.find(x => x.name === name);
    e.sel.className = 'lc-sel';
    e.sel.innerHTML = `${imgSpan(l && l.img)}<span>${escH(name)}</span>`;
  }
  function buildComboList(cid) {
    comboEls(cid).list.innerHTML = LEGENDS.map(l =>
      `<button type="button" class="lc-opt" data-name="${escH(l.name)}">${imgSpan(l.img)}<span>${escH(l.name)}</span></button>`
    ).join('');
  }
  function filterList(cid, q) {
    q = q.toLowerCase();
    for (const opt of comboEls(cid).list.children)
      opt.style.display = opt.dataset.name.toLowerCase().includes(q) ? '' : 'none';
  }
  const closeMenus = () => document.querySelectorAll('.lc-menu').forEach(m => m.hidden = true);
  function initCombo(cid) {
    const e = comboEls(cid);
    e.btn.onclick = () => {
      const wasOpen = !e.menu.hidden; closeMenus();
      if (!wasOpen) { e.menu.hidden = false; e.search.value = ''; filterList(cid, ''); e.search.focus(); }
    };
    e.search.oninput = () => filterList(cid, e.search.value);
    e.list.onclick = ev => { const b = ev.target.closest('.lc-opt'); if (!b) return; setCombo(cid, b.dataset.name); e.menu.hidden = true; };
  }
  const syncCombos = () => comboIds.forEach(cid => setCombo(cid, comboEls(cid).input.value));
  document.addEventListener('click', e => { if (!e.target.closest('.legend-combo')) closeMenus(); });

  async function loadLegends() {
    try {
      const db = await (await fetch(CARD_DB_URL)).json();
      const seen = new Set();
      for (const id in db) {
        const c = db[id];
        if ((c.type || '') !== 'Legend') continue;
        const name = c.name && c.name.en;
        if (!name || seen.has(name)) continue;
        const imgs = c.face && c.face.front && c.face.front.image;
        seen.add(name);
        LEGENDS.push({ name, img: (imgs && (imgs.en || Object.values(imgs)[0])) || '' });
      }
      LEGENDS.sort((a, b) => a.name.localeCompare(b.name));
      comboIds.forEach(buildComboList);
      syncCombos(); // now that images are available
    } catch (_) { /* dropdown still works with typed/detected value */ }
  }
  comboIds.forEach(initCombo);
  loadLegends();

  window.recordForm.onPrefill(data => {
    for (const f of fields) setVal(f, data[f]);
    syncCombos(); // reflect auto-detected legends in the image dropdowns
    if (data.baronPit) $('baronPit').checked = true;
    if (data.brush) $('brush').checked = true;
    if (data.tookMulligan) $('tookMulligan').checked = true;
    const g = data.gameNo || 1;
    $('matchline').innerHTML = data.matchInProgress
      ? `Continuing match — recording <b>game ${g}</b>.`
      : `New match — recording <b>game 1</b>.`;
  });

  function collect() {
    const d = {};
    for (const f of fields) d[f] = $(f).value;
    d.baronPit = $('baronPit').checked;
    d.brush = $('brush').checked;
    d.tookMulligan = $('tookMulligan').checked;
    return d;
  }

  $('continueMatch').onclick = () => window.recordForm.submit(collect(), 'continue');
  $('completeMatch').onclick = () => window.recordForm.submit(collect(), 'complete');
  $('cancel').onclick = () => window.recordForm.cancel();

  window.recordForm.ready();
</script>
</body>
</html>
